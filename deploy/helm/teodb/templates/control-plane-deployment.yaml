{{- if eq .Values.mode "cluster" }}
{{- if and .Values.controlPlane.persistence.enabled (gt (int .Values.controlPlane.replicas) 0) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "teodb.fullname" . }}-control-plane
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  accessModes:
    {{- toYaml .Values.controlPlane.persistence.accessModes | nindent 4 }}
  {{- if .Values.controlPlane.persistence.storageClass }}
  storageClassName: {{ .Values.controlPlane.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.controlPlane.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teodb.fullname" . }}-control-plane
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  # V1 runs a single active control plane during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "teodb.componentSelectorLabels" (dict "root" . "role" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teodb.componentSelectorLabels" (dict "root" . "role" "control-plane") | nindent 8 }}
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "teodb.controlPlaneConfig" . | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "teodb.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add .Values.shutdown.drainTimeoutSecs 15 }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teodb-control-plane
          image: {{ include "teodb.image" (dict "root" . "image" .Values.controlPlane.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - {{ include "teodb.configDir" . }}/control-plane.toml
          env:
            {{- include "teodb.commonEnv" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: control-plane
              containerPort: {{ .Values.controlPlane.grpcPort }}
          # Control plane is gRPC-only; probe the port, not HTTP.
          startupProbe:
            tcpSocket:
              port: control-plane
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: control-plane
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: control-plane
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- with .Values.controlPlane.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "teodb.configDir" . }}
              readOnly: true
            - name: data
              mountPath: {{ include "teodb.dataDir" . }}
      volumes:
        - name: config
          configMap:
            name: {{ include "teodb.fullname" . }}-config
        - name: data
          {{- if .Values.controlPlane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "teodb.fullname" . }}-control-plane
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
