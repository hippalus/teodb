{{- if eq .Values.mode "standalone" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "teodb.fullname" . }}
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: standalone
spec:
  serviceName: {{ include "teodb.fullname" . }}-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "teodb.componentSelectorLabels" (dict "root" . "role" "standalone") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teodb.componentSelectorLabels" (dict "root" . "role" "standalone") | nindent 8 }}
        {{- with .Values.standalone.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "teodb.standaloneConfig" . | sha256sum }}
        {{- with .Values.standalone.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "teodb.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add .Values.shutdown.drainTimeoutSecs 15 }}
      {{- with .Values.standalone.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.standalone.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.standalone.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teodb
          image: {{ include "teodb.image" (dict "root" . "image" .Values.standalone.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - {{ include "teodb.configDir" . }}/standalone.toml
          env:
            {{- include "teodb.commonEnv" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: rest
              containerPort: {{ .Values.service.restPort }}
            - name: flight
              containerPort: {{ .Values.service.flightPort }}
          startupProbe:
            httpGet:
              path: /ready
              port: rest
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /live
              port: rest
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: rest
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- with .Values.standalone.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "teodb.configDir" . }}
              readOnly: true
            - name: data
              mountPath: {{ include "teodb.dataDir" . }}
            - name: cache
              mountPath: {{ include "teodb.cacheDir" . }}
            - name: spill
              mountPath: {{ include "teodb.spillDir" . }}
      volumes:
        - name: config
          configMap:
            name: {{ include "teodb.fullname" . }}-config
        - name: spill
          emptyDir: {}
        {{- if not .Values.standalone.persistence.cache.enabled }}
        - name: cache
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "teodb.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.standalone.persistence.wal.accessModes | nindent 10 }}
        {{- if .Values.standalone.persistence.wal.storageClass }}
        storageClassName: {{ .Values.standalone.persistence.wal.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.standalone.persistence.wal.size | quote }}
    {{- if .Values.standalone.persistence.cache.enabled }}
    - metadata:
        name: cache
        labels:
          {{- include "teodb.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.standalone.persistence.cache.accessModes | nindent 10 }}
        {{- if .Values.standalone.persistence.cache.storageClass }}
        storageClassName: {{ .Values.standalone.persistence.cache.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.standalone.persistence.cache.size | quote }}
    {{- end }}
{{- end }}
