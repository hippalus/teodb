{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "teodb.fullname" . }}
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
rules:
  # Read-only access to pod/endpoint topology within the namespace.
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "teodb.fullname" . }}
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "teodb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "teodb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
