apiVersion: v1
kind: Pod
metadata:
  name: {{ include "teodb.fullname" . }}-test-connection
  labels:
    {{- include "teodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.10.1
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          base="http://{{ include "teodb.fullname" . }}:{{ .Values.service.restPort }}"
          echo "GET ${base}/ready"
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused "${base}/ready"
          echo
          echo "POST ${base}/api/v1/query (SELECT 1)"
          curl -fsS -X POST "${base}/api/v1/query" \
            -H 'content-type: application/json' \
            -d '{"sql":"SELECT 1 AS ok"}'
          echo
          echo "helm test: OK"
