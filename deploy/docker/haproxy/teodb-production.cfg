global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    retries 3

frontend teodb_rest
    mode http
    bind *:8080
    default_backend teodb_data_nodes_rest

backend teodb_data_nodes_rest
    mode http
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    server teodb-data-node-1 teodb-data-node-1:8080 check inter 3s fall 3 rise 2
    server teodb-data-node-2 teodb-data-node-2:8080 check inter 3s fall 3 rise 2
    server teodb-data-node-3 teodb-data-node-3:8080 check inter 3s fall 3 rise 2

frontend teodb_flight
    mode tcp
    bind *:8815
    default_backend teodb_data_nodes_flight

backend teodb_data_nodes_flight
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    server teodb-data-node-1 teodb-data-node-1:8815 check inter 3s fall 3 rise 2
    server teodb-data-node-2 teodb-data-node-2:8815 check inter 3s fall 3 rise 2
    server teodb-data-node-3 teodb-data-node-3:8815 check inter 3s fall 3 rise 2

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
