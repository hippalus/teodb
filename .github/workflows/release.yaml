name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git rev-parse --verify "${RELEASE_TAG}^{commit}" >/dev/null

          version="${RELEASE_TAG#v}"
          workspace_version="$(
            awk -F '=' '
              /^\[workspace\.package\]$/ { in_workspace = 1; next }
              /^\[/ { in_workspace = 0 }
              in_workspace && /^version[[:space:]]*=/ {
                gsub(/[[:space:]"]/, "", $2)
                print $2
                exit
              }
            ' Cargo.toml
          )"

          if [[ "$version" != "$workspace_version" ]]; then
            echo "Tag version $version does not match workspace version $workspace_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Verify release commit
    uses: ./.github/workflows/ci.yaml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      full_container_build: false
    permissions:
      contents: read

  build-binaries:
    name: Binary (${{ matrix.target }})
    needs:
      - validate
      - ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build embedded UI
        shell: bash
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install protobuf compiler
        id: protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build release binary
        shell: bash
        env:
          PROTOC_INCLUDE: ${{ steps.protoc.outputs.path }}/include
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin teodb

      - name: Package release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          archive="teodb-${VERSION}-${TARGET}"
          mkdir -p "dist/${archive}/config"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/${TARGET}/release/teodb.exe" "dist/${archive}/"
          else
            cp "target/${TARGET}/release/teodb" "dist/${archive}/"
          fi
          cp deploy/docker/config/*.toml "dist/${archive}/config/"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "dist/${archive}.zip" "./dist/${archive}/*"
          else
            tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          fi

          rm -rf "dist/${archive}"

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teodb-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-docker:
    name: Multi-architecture container
    needs:
      - validate
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx CLI
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver: docker

      - name: Start Docker Buildx container builder
        id: buildx-container
        run: bash scripts/ci/setup-buildx-builder.sh "$BUILDKIT_IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          builder: ${{ steps.buildx-container.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-chart:
    name: Package and publish Helm chart
    needs:
      - validate
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      # Helm 3 is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Lint chart
        run: helm lint deploy/helm/teodb

      - name: Package chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package deploy/helm/teodb \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Push chart to GHCR (OCI)
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          echo "$GHCR_TOKEN" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin
          helm push "dist/teodb-${VERSION}.tgz" "oci://${REGISTRY}/${owner}/charts"
          helm registry logout "$REGISTRY" || true

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teodb-chart
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs:
      - validate
      - ci
      - build-binaries
      - build-docker
      - build-chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: teodb-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum teodb-* > SHA256SUMS

      - name: Attest binary archives
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/teodb-*
            dist/SHA256SUMS
