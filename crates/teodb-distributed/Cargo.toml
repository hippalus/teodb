[package]
name = "teodb-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Distributed execution, partition assignment, and compaction for TeoDB"
license.workspace = true

[dependencies]
# Workspace crates
teodb-core = { path = "../teodb-core" }
teodb-query = { path = "../teodb-query" }
teodb-storage = { path = "../teodb-storage" }

# Hashing
# Async
backon = { workspace = true }
tokio = { workspace = true }
