# Flight SQL Query Benchmark — TPC-H Analytical Queries
#
# Tests Flight SQL query execution throughput with TPC-H analytical workload.
# Requires TPC-H data to be loaded first:
#
#   cargo run -p teodb-perf-suite -- load \
#     --dataset crates/teodb-perf-suite/datasets/tpch.toml
#
# Then run:
#   cargo run -p teodb-perf-suite -- run-flight-bench \
#     --bench crates/teodb-perf-suite/scenarios/flight_tpch.toml

name = "flight_sql_tpch"
warmup_runs = 2
measured_runs = 5

# ── Point queries (fast) ───────────────────────────────────────────

[[ops]]
name = "tpch_region_scan"
op = "query"
sql = "SELECT * FROM tpch.region"

[[ops]]
name = "tpch_nation_scan"
op = "query"
sql = "SELECT * FROM tpch.nation"

[[ops]]
name = "tpch_region_count"
op = "query"
sql = "SELECT COUNT(*) AS cnt FROM tpch.region"

# ── Aggregation queries ───────────────────────────────────────────

[[ops]]
name = "tpch_orders_count"
op = "query"
sql = "SELECT COUNT(*) AS cnt FROM tpch.orders"

[[ops]]
name = "tpch_lineitem_count"
op = "query"
sql = "SELECT COUNT(*) AS cnt FROM tpch.lineitem"

[[ops]]
name = "tpch_revenue_sum"
op = "query"
sql = "SELECT SUM(l_extendedprice * (1 - l_discount)) AS revenue FROM tpch.lineitem"

# ── TPC-H analytical queries (subset) ─────────────────────────────

[[ops]]
name = "tpch_q1_pricing_summary"
op = "query"
sql = """
SELECT
    l_returnflag,
    l_linestatus,
    SUM(l_quantity) AS sum_qty,
    SUM(l_extendedprice) AS sum_base_price,
    SUM(l_extendedprice * (1 - l_discount)) AS sum_disc_price,
    SUM(l_extendedprice * (1 - l_discount) * (1 + l_tax)) AS sum_charge,
    AVG(l_quantity) AS avg_qty,
    AVG(l_extendedprice) AS avg_price,
    AVG(l_discount) AS avg_disc,
    COUNT(*) AS count_order
FROM tpch.lineitem
WHERE l_shipdate <= '1998-09-02'
GROUP BY l_returnflag, l_linestatus
ORDER BY l_returnflag, l_linestatus
"""

[[ops]]
name = "tpch_q6_forecasting_revenue"
op = "query"
sql = """
SELECT SUM(l_extendedprice * l_discount) AS revenue
FROM tpch.lineitem
WHERE l_shipdate >= '1994-01-01'
  AND l_shipdate < '1995-01-01'
  AND l_discount BETWEEN 0.05 AND 0.07
  AND l_quantity < 24
"""

[[ops]]
name = "tpch_nation_supplier_join"
op = "query"
sql = """
SELECT
    n_name,
    COUNT(*) AS supplier_count,
    SUM(s_acctbal) AS total_balance
FROM tpch.supplier
JOIN tpch.nation ON s_nationkey = n_nationkey
GROUP BY n_name
ORDER BY supplier_count DESC
LIMIT 10
"""

[[ops]]
name = "tpch_customer_nation_join"
op = "query"
sql = """
SELECT
    n_name,
    COUNT(*) AS customer_count,
    AVG(c_acctbal) AS avg_balance
FROM tpch.customer
JOIN tpch.nation ON c_nationkey = n_nationkey
GROUP BY n_name
ORDER BY customer_count DESC
LIMIT 10
"""
